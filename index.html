
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Общий счётчик посещений</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    h1 {
      font-size: 30px;
      color: #222;
    }

    #counter {
      font-size: 90px;
      font-weight: bold;
      color: #2563eb;
      margin: 25px 0;
    }

    button {
      padding: 18px 30px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 20px;
      cursor: pointer;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    #status {
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Посетили сайт</h1>
    <div id="counter">0</div>
    <button id="visitButton">Я посетил сайт!</button>
    <p id="status">Загрузка счётчика...</p>
  </div>

  <script>
    const KEY = "playzone_shared_visits_2026";
    const API = "https://countapi.mileshilliard.com/api/v1";

    const counter = document.getElementById("counter");
    const button = document.getElementById("visitButton");
    const status = document.getElementById("status");

    const alreadyVisited =
      localStorage.getItem("playzone_already_visited") === "yes";

    if (alreadyVisited) {
      button.disabled = true;
      button.textContent = "Ты уже посетил сайт!";
      status.textContent = "Спасибо за посещение!";
    }

    async function updateCounter() {
      try {
        const response = await fetch(
          `${API}/get/${KEY}`,
          { cache: "no-store" }
        );

        if (!response.ok) throw new Error();

        const data = await response.json();
        counter.textContent = data.value;
      } catch {
        status.textContent = "Не удалось загрузить счётчик";
      }
    }

    button.addEventListener("click", async () => {
      if (localStorage.getItem("playzone_already_visited") === "yes") {
        return;
      }

      button.disabled = true;
      status.textContent = "Засчитываем посещение...";

      try {
        const response = await fetch(`${API}/hit/${KEY}`);

        if (!response.ok) throw new Error();

        const data = await response.json();

        localStorage.setItem("playzone_already_visited", "yes");

        counter.textContent = data.value;
        button.textContent = "Ты уже посетил сайт!";
        status.textContent = "Спасибо за посещение!";
      } catch {
        button.disabled = false;
        status.textContent = "Ошибка! Попробуй ещё раз.";
      }
    });

    updateCounter();
    setInterval(updateCounter, 5000);
  </script>
</body>
</html>
